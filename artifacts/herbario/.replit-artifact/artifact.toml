kind = "mobile"
previewPath = "/"
title = "Herbario Digital"
version = "1.0.0"
id = "artifacts/herbario"
router = "expo-domain"

[[integratedSkills]]
name = "expo"
version = "1.0.0"

[[services]]
ensurePreviewReachable = "/status"
name = "expo"
paths = [ "/" ]
localPort = 18487

[services.development]
run = "pnpm --filter @workspace/herbario run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/herbario", "run", "build" ]
run = [ "pnpm", "--filter", "@workspace/herbario", "run", "serve" ]

[services.env]
PORT = "18487"
BASE_PATH = "/"
