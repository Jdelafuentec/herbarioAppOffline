name: Deploy Herbario PWA to GitHub Pages

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        working-directory: artifacts/herbario
        run: npm install --legacy-peer-deps

      - name: Build and Export Web App
        working-directory: artifacts/herbario
        run: npx expo export --platform web

      - name: Prepare dist folder
        run: |
          # Disable Jekyll so GitHub Pages serves _expo/ folder correctly
          touch artifacts/herbario/dist/.nojekyll
          # Copy PWA files
          cp artifacts/herbario/public/sw.js artifacts/herbario/dist/sw.js
          cp artifacts/herbario/public/manifest.json artifacts/herbario/dist/manifest.json
          cp artifacts/herbario/public/icon-192.png artifacts/herbario/dist/icon-192.png
          cp artifacts/herbario/public/icon-512.png artifacts/herbario/dist/icon-512.png
          echo "=== Contents of dist ==="
          ls -la artifacts/herbario/dist/

      - name: Deploy to GitHub Pages
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          folder: artifacts/herbario/dist
          branch: gh-pages
          clean: true
          single-commit: true
