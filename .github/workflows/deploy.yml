name: Deploy Herbario PWA to GitHub Pages

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        working-directory: artifacts/herbario
        run: |
          echo "=== Installing dependencies ==="
          npm install --legacy-peer-deps 2>&1 | tail -20

      - name: Build and Export Web App
        working-directory: artifacts/herbario
        run: |
          echo "=== Building Expo web app ==="
          npx expo export --platform web
          echo "=== Build complete. Contents of dist: ==="
          ls -la dist/ || echo "No dist folder found!"

      - name: Prepare docs folder for GitHub Pages
        run: |
          echo "=== Preparing docs/ for GitHub Pages ==="
          rm -rf docs
          cp -r artifacts/herbario/dist docs
          touch docs/.nojekyll
          cp artifacts/herbario/public/sw.js docs/sw.js
          cp artifacts/herbario/public/manifest.json docs/manifest.json
          cp artifacts/herbario/public/icon-192.png docs/icon-192.png
          cp artifacts/herbario/public/icon-512.png docs/icon-512.png
          echo "=== Contents of docs/: ==="
          ls -la docs/

      - name: Commit and push docs folder
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add docs/
          git diff --cached --quiet || git commit -m "chore: update built PWA [skip ci]"
          git push
